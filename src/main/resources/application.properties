quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=${AUTH_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
quarkus.http.cors.headers=${AUTH_CORS_HEADERS:accept,authorization,content-type,x-requested-with}
quarkus.jackson.fail-on-unknown-properties=false
auth.database.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.token.key.location=${AUTH_TOKEN_KEY_LOCATION:}
